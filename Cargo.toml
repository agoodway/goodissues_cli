[package]
name = "goodissues"
version = "0.2.0"
edition = "2024"
description = "Command-line client for GoodIssues"
repository = "https://github.com/agoodway/goodissues_cli"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
