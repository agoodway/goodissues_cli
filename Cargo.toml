[package]
name = "goodissues"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Command-line client for GoodIssues"
repository = "https://github.com/agoodway/goodissues_cli"

[dependencies]
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1.12"
unicode-width = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
